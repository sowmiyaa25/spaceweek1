<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPACE WEEK 2026 — The Journey Beyond</title>
  <meta name="description" content="A 7-day space adventure. Become a cadet and complete missions." />
  <meta name="theme-color" content="#05070f" />

  <!-- Fonts (need internet; the page still works with fallback fonts if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== BACKGROUND (shared by every screen) ===== -->
  <div class="space" aria-hidden="true">
    <div class="stars stars--far"></div>
    <div class="stars stars--mid"></div>
    <div class="stars stars--near"></div>
    <div class="nebula"></div>
    <div class="earth"></div>

    <!-- A small satellite drifting across the sky -->
    <svg class="satellite" viewBox="0 0 64 32" width="64" height="32">
      <rect x="2"  y="10" width="18" height="12" rx="1" fill="#2c4a7c" stroke="#7fd8ff" stroke-width="1"/>
      <rect x="44" y="10" width="18" height="12" rx="1" fill="#2c4a7c" stroke="#7fd8ff" stroke-width="1"/>
      <rect x="24" y="8"  width="16" height="16" rx="3" fill="#c9d6ee"/>
      <circle cx="32" cy="16" r="3" fill="#05070f"/>
      <line x1="20" y1="16" x2="24" y2="16" stroke="#7fd8ff" stroke-width="1"/>
      <line x1="40" y1="16" x2="44" y2="16" stroke="#7fd8ff" stroke-width="1"/>
    </svg>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main>

    <!-- ===== SCREEN 1: LANDING ===== -->
    <section id="screen-landing" class="screen is-active" aria-labelledby="landing-title">
      <p class="kicker">SPACE WEEK 2026</p>
      <h1 id="landing-title" class="title">THE JOURNEY<br />BEYOND</h1>

      <p class="tagline">
        <span>7 DAYS.</span>
        <span>7 MISSIONS.</span>
        <span>1 JOURNEY BEYOND.</span>
      </p>

      <button id="enter-btn" class="btn btn--primary" type="button">
        ENTER MISSION CONTROL
      </button>
    </section>

    <!-- ===== SCREEN 2: THE MISSION (drawn step by step by script.js) ===== -->
    <section id="screen-mission" class="screen screen--top" aria-labelledby="mission-title" hidden>
      <div class="mission">
        <div class="mission__bar">
          <button id="exit-mission-btn" class="btn btn--ghost btn--small" type="button">← BACK TO START</button>
          <p class="mission__xp">MISSION XP <b id="mission-xp">0</b></p>
        </div>
        <p class="kicker">MISSION 01 — SPACE EXPLORER</p>
        <h2 id="mission-title" class="panel__title"></h2>
        <div id="mission-stage" class="panel stage" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <script src="missions.js"></script>
  <script src="script.js"></script>
</body>
</html>
